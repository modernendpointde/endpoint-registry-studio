services:
  endpoint-registry-studio:
    image: ghcr.io/modernendpointde/endpoint-registry-studio:${IMAGE_TAG:-latest}
    pull_policy: always
    ports:
      - "${HOST_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
